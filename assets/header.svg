<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Ciao, sono Giovanni — Chef di professione, Dev per passione · Chef by trade, Dev by passion">
<title>Ciao, sono Giovanni — Chef di professione, Dev per passione · Chef by trade, Dev by passion</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a1b2e"/>
  </linearGradient>
  <radialGradient id="glow-a" cx=".88" cy=".05" r=".55">
    <stop offset="0" stop-color="#bb9af7" stop-opacity=".30"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-b" cx=".02" cy="1" r=".6">
    <stop offset="0" stop-color="#7aa2f7" stop-opacity=".24"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/>
  </pattern>
  <clipPath id="frame"><rect width="900" height="250" rx="16"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
  .muted { fill: #8b949e; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .18em; fill: url(#accent); }
  .accent { fill: url(#accent); }
  .prompt { fill: #9ece6a; }
  .cmd { fill: #c0caf5; }
  .fade { animation: fade .6s ease-out both; }
  .cursor { animation: blink 1.1s steps(1) 2.2s infinite; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g clip-path="url(#frame)">
  <rect width="900" height="250" fill="url(#bg)"/>
  <rect width="900" height="250" fill="url(#dots)"/>
  <rect width="900" height="250" fill="url(#glow-a)"/>
  <rect width="900" height="250" fill="url(#glow-b)"/>
</g>
<rect x=".5" y=".5" width="899" height="249" rx="16" fill="none" stroke="#30363d"/>

<g class="fade">
  <text x="48" y="62" class="kicker">CHEF · DEV · HOMELAB</text>
  <text x="46" y="110" font-size="40" font-weight="700">Ciao, sono <tspan class="accent">Giovanni</tspan> 👋</text>
  <text x="48" y="138" font-size="17" class="muted">Hi, I'm Giovanni</text>
</g>
<g class="fade" style="animation-delay:.25s">
  <text x="48" y="178" font-size="17" font-weight="600">Chef di professione · Dev per passione</text>
  <text x="48" y="201" font-size="13.5" font-style="italic" class="muted">Chef by trade · Dev by passion</text>
  <text x="48" y="222" font-size="13.5" class="muted">Italian fine dining by day · homelab &amp; automation by night</text>
</g>

<g class="fade" style="animation-delay:.4s">
  <rect x="560" y="40" width="300" height="170" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M560 68h300" stroke="#30363d"/>
  <circle cx="579" cy="54" r="5.5" fill="#ff5f56"/>
  <circle cx="597" cy="54" r="5.5" fill="#ffbd2e"/>
  <circle cx="615" cy="54" r="5.5" fill="#27c93f"/>
  <text x="740" y="58" class="mono muted" style="font-size:11px" text-anchor="middle">giovanni@homelab: ~</text>
</g>
<text x="578" y="94" class="mono fade" style="animation-delay:.8s"><tspan class="prompt">~ $</tspan><tspan class="cmd"> whoami</tspan></text>
<text x="578" y="116" class="mono fade" style="animation-delay:1.1s; fill:#7aa2f7">chef de partie &amp; homelabber</text>
<text x="578" y="144" class="mono fade" style="animation-delay:1.5s"><tspan class="prompt">~ $</tspan><tspan class="cmd"> ls ricette/</tspan></text>
<text x="578" y="166" class="mono fade" style="animation-delay:1.8s"><tspan fill="#7aa2f7">carbonara.md</tspan>  <tspan fill="#bb9af7">ragu.yml</tspan>  <tspan fill="#9ece6a">josper.sh</tspan></text>
<g class="fade" style="animation-delay:2.1s">
  <text x="578" y="194" class="mono prompt">~ $</text>
  <rect x="610" y="183" width="8" height="15" fill="#c0caf5" class="cursor"/>
</g>
</svg>
